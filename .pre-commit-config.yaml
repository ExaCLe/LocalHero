repos:
  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]
        files: ^frontend/
        entry: bash
        args:
          - -lc
          - cd frontend && npm run lint

      - id: frontend-type-check
        name: Frontend TypeScript type-check
        language: system
        pass_filenames: false
        types_or: [ts, tsx]
        files: ^frontend/
        entry: bash
        args:
          - -lc
          - cd frontend && npm run type-check
